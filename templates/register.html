<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>

<body>
  <div class="container center-wrap">
    <div class="center-box">

      <div class="cardx formx">
        <h2>Регистрация</h2>
        <p>Заполните поля, чтобы создать аккаунт.</p>

        <form method="post">
          <div class="form-group">
            <label>Имя</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Электронная почта</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Повторите пароль</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>

          <div class="file-row" style="justify-content: space-between;">
            <input type="submit" name="submit" class="btnx primary" value="Зарегистрироваться">
            <a class="small-link" href="/">Уже есть аккаунт?</a>
          </div>

          {% if error_message %}
            <div class="alert alert-danger mt-3" role="alert">
              {{ error_message }}
            </div>
          {% endif %}
        </form>
      </div>

    </div>
  </div>
</body>
</html>
